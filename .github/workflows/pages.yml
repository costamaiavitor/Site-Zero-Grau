# Publica a pasta ZeroGrau/ no GitHub Pages.
# Requer, uma única vez: Settings → Pages → Source = GitHub Actions.
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ZeroGrau
      - id: deploy
        uses: actions/deploy-pages@v4
