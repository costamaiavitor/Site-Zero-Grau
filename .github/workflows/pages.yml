# Publica a pasta ZeroGrau/ no GitHub Pages, que passa a ser a raiz do site.
#
# Duas condições, ambas fora deste arquivo:
#   1. repositório público (no plano gratuito o Pages não atende repo privado);
#   2. Settings → Pages → Source = GitHub Actions, uma única vez.
#
# O passo 2 não dá para automatizar aqui: criar o site pela API exige permissão
# de administração, que o GITHUB_TOKEN do workflow não recebe — com
# `enablement: true` o configure-pages morre em "Resource not accessible by
# integration". Depois de criado uma vez, todo push na main publica sozinho.
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ZeroGrau
      - id: deploy
        uses: actions/deploy-pages@v4
