# Publica a pasta ZeroGrau/ no GitHub Pages, que passa a ser a raiz do site.
# Não precisa configurar nada à mão: o enablement do configure-pages liga o
# Pages pela API na primeira execução. Exige repositório público (ou GitHub
# Pro), porque no plano gratuito o Pages não atende repositório privado.
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # sem isto a action só consulta o Pages e falha se ele não existir
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ZeroGrau
      - id: deploy
        uses: actions/deploy-pages@v4
